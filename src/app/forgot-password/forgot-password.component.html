<section class="forgot-page">
  <div class="forgot-panel">
    <a class="back-link" routerLink="/login">返回登入</a>

    <p class="eyebrow">問卷平台</p>
    <h1>忘記密碼</h1>

    @if (step === 'request') {
      <p class="description">輸入註冊時使用的 Email，我們會寄送一次性驗證碼。</p>

      <form (ngSubmit)="requestCode()">
        <label class="field">
          <span>Email</span>
          <input
            type="email"
            name="email"
            [(ngModel)]="email"
            autocomplete="email"
            placeholder="請輸入註冊 Email"
          />
        </label>

        @if (errorMessage) {
          <p class="error-message" role="alert">{{ errorMessage }}</p>
        }

        <button type="submit" [disabled]="isSubmitting">
          {{ isSubmitting ? '寄送中...' : '寄送驗證碼' }}
        </button>
      </form>
    } @else {
      <p class="description">請輸入寄到 {{ email }} 的 6 位數驗證碼和新密碼。</p>

      @if (noticeMessage) {
        <p class="notice-message" role="status">{{ noticeMessage }}</p>
      }

      <form (ngSubmit)="confirmReset()">
        <label class="field">
          <span>驗證碼</span>
          <input
            type="text"
            name="code"
            [(ngModel)]="code"
            inputmode="numeric"
            maxlength="6"
            autocomplete="one-time-code"
            placeholder="請輸入 6 位數驗證碼"
          />
        </label>

        <label class="field">
          <span>新密碼</span>
          <input
            type="password"
            name="newPassword"
            [(ngModel)]="newPassword"
            autocomplete="new-password"
            placeholder="至少 8 個字元"
          />
        </label>

        <label class="field">
          <span>確認新密碼</span>
          <input
            type="password"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            autocomplete="new-password"
            placeholder="再次輸入新密碼"
          />
        </label>

        @if (errorMessage) {
          <p class="error-message" role="alert">{{ errorMessage }}</p>
        }

        <button type="submit" [disabled]="isSubmitting">
          {{ isSubmitting ? '更新中...' : '更新密碼' }}
        </button>
      </form>

      <button class="secondary-button" type="button" (click)="requestAnotherCode()">
        重新輸入 Email
      </button>
    }

    <p class="account-link">想起密碼了？<a routerLink="/login">返回登入</a></p>
  </div>
</section>
