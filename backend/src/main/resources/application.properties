# Spring Boot 後端的基本設定。

spring.application.name=personal-survey-system-backend
server.port=${PORT:8082}

# 請先在 MySQL 建立 personal_quiz_db，再依照自己的帳號設定環境變數。
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/personal_quiz_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# 使用手動 SQL 建表，再讓 Entity 對應既有資料表。
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.sql.init.mode=never
spring.jpa.open-in-view=false

# 本機預設使用開發密鑰；正式環境必須啟用 prod profile，並提供 JWT_SECRET。
app.jwt.secret=${JWT_SECRET:personal-survey-system-development-secret-key-please-change-this}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# 忘記密碼驗證信。正式環境請用環境變數提供 SMTP 設定。
# 本機預設使用示範模式，驗證碼會顯示在忘記密碼頁面；正式環境會在 prod 設定關閉。
app.mail.dev-mode=${MAIL_DEV_MODE:true}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# Angular 開發伺服器的來源；正式環境請改成真正的前端網址。
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
